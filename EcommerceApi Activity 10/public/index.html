<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECommerceApi - Product Catalog</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Navigation Header -->
      <header class="header">
        <div class="header-content">
          <div class="header-top">
            <div>
              <h1 class="logo">ECommerceApi</h1>
              <p class="tagline">Your Ultimate Online Shopping Experience</p>
            </div>
            <nav class="auth-nav">
              <a href="/login.html" id="loginLink" class="btn btn-secondary"
                >Login</a
              >
              <button
                id="logoutBtn"
                class="btn btn-danger"
                style="display: none"
              >
                Logout
              </button>
            </nav>
          </div>
        </div>
      </header>

      <!-- Filter Section -->
      <nav class="filter-section">
        <div class="filter-container">
          <h2>Filter Products</h2>
          <div class="filter-controls">
            <div class="filter-group">
              <label for="categoryFilter">Category:</label>
              <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Sportswear">Sportswear</option>
                <option value="Home Appliances">Home Appliances</option>
                <option value="Accessories">Accessories</option>
                <option value="Fitness">Fitness</option>
                <option value="Home">Home</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="priceFilter">Max Price:</label>
              <input
                type="number"
                id="priceFilter"
                placeholder="Enter max price"
                min="0"
                step="0.01"
              />
            </div>
            <button id="applyFiltersBtn" class="btn btn-primary">
              Apply Filters
            </button>
            <button id="resetFiltersBtn" class="btn btn-secondary">
              Reset
            </button>
          </div>
        </div>
      </nav>

      <!-- Loading Indicator -->
      <div id="loadingIndicator" class="loading hidden">
        <p>Loading products...</p>
      </div>

      <!-- Error Message Container -->
      <div id="errorContainer" class="error hidden"></div>

      <!-- Main Product Grid -->
      <main id="productContainer" class="product-grid">
        <!-- Products will be dynamically inserted here by JavaScript -->
      </main>

      <!-- Empty State Message -->
      <div id="emptyState" class="empty-state hidden">
        <p>No products available at the moment. Please try again later.</p>
      </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
      // Handle logout button
      document.getElementById("logoutBtn").addEventListener("click", logout);

      // Check authentication status and update UI
      async function updateAuthUI() {
        const isAuthenticated = await checkAuthenticationStatus();
        const loginLink = document.getElementById("loginLink");
        const logoutBtn = document.getElementById("logoutBtn");

        if (isAuthenticated) {
          loginLink.style.display = "none";
          logoutBtn.style.display = "inline-block";
        } else {
          loginLink.style.display = "inline-block";
          logoutBtn.style.display = "none";
        }
      }

      // Update auth UI when page loads
      document.addEventListener("DOMContentLoaded", updateAuthUI);
    </script>
  </body>
</html>
